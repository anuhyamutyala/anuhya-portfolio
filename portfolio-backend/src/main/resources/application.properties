spring.application.name=portfolio-backend

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

resend.api.key=${RESEND_API_KEY}
portfolio.notification.email=${PORTFOLIO_EMAIL}

frontend.url=${FRONTEND_URL:http://localhost:5174}